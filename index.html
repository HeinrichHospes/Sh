<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warteschlange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }

/* Layout: method bar on top (code buttons), below one large stage: counter on the left, queue lane, open waiting area; people are free-floating cards */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #18212a;
  --muted: #5a6875;
  --line: #cfd8e0;
  --floor: #e3e9ee;
  --lane: #d3dde6;
  --accent: #e0662b;
  --accent-soft: #fde6da;
  --code-bg: #1d2731;
  --code-ink: #e8eef3;
  --code-key: #8fd3ff;
  --glow: #ffb547;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19222b; --ink: #e7edf2; --muted: #9eadba; --line: #2c3946;
    --floor: #18212a; --lane: #22303d; --accent: #ff8a4f; --accent-soft: #3a2418;
    --code-bg: #0b1116; --code-ink: #e8eef3; --code-key: #8fd3ff; --glow: #ffb547;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19222b; --ink: #e7edf2; --muted: #9eadba; --line: #2c3946;
  --floor: #18212a; --lane: #22303d; --accent: #ff8a4f; --accent-soft: #3a2418;
  --code-bg: #0b1116; --code-ink: #e8eef3; --code-key: #8fd3ff; --glow: #ffb547;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
  display: flex; flex-direction: column; gap: 12px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { font-family: var(--font-display); font-size: clamp(22px, 3.4vw, 32px); margin: 0; }
.decl { font-family: var(--font-code); font-size: clamp(13px, 1.6vw, 16px); color: var(--muted); }
.decl b { color: var(--accent); font-weight: 700; }
.methods { display: flex; flex-wrap: wrap; gap: 10px; }
.m {
  font-family: var(--font-code); font-weight: 500; font-size: clamp(14px, 1.9vw, 20px);
  background: var(--code-bg); color: var(--code-ink); border: 2px solid transparent;
  padding: 12px 16px; border-radius: 12px; cursor: pointer; text-align: left;
  transition: box-shadow .2s, transform .2s, border-color .2s;
}
.m .obj { color: var(--code-key); }
.m .arg { color: #ffcf8a; }
.m:hover { border-color: var(--line); }
.m:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.m[aria-pressed="true"] {
  border-color: var(--glow);
  box-shadow: 0 0 0 4px rgba(255,181,71,.35), 0 0 28px 6px rgba(255,181,71,.55);
  transform: translateY(-2px);
}
.stage {
  position: relative; flex: 1; min-height: 560px; border-radius: 18px; overflow: hidden;
  background: var(--floor); border: 1px solid var(--line); touch-action: none;
}
.counter {
  position: absolute; left: 0; top: 0; bottom: 0; width: 13%; min-width: 74px;
  background: var(--surface); border-right: 4px solid var(--accent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px;
}
.counter .sign { font-family: var(--font-display); font-weight: 700; font-size: clamp(13px, 1.6vw, 18px); text-transform: uppercase; letter-spacing: .08em; writing-mode: vertical-rl; transform: rotate(180deg); color: var(--accent); }
.counter svg { width: 70%; max-width: 70px; height: auto; }
.lane {
  position: absolute; left: 13%; right: 0; top: 5%; height: 34%;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--line) calc(10% - 2px) 10%), var(--lane);
  border-block: 3px dashed var(--line);
}
.ropes { position: absolute; left: 13%; right: 0; height: 0; border-top: 4px solid var(--muted); opacity: .35; }
.area-label { position: absolute; font: 700 12px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.person {
  position: absolute; width: clamp(56px, 6.6%, 104px); touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: grab; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%);
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.18)); transition: filter .15s;
}
.person svg { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 22%; border-radius: 14px 14px 6px 6px; border: 3px solid var(--surface); background: var(--surface); display: block; pointer-events: none; }
.person .tag { margin-top: -6px; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; font: 700 clamp(11px, 1.2vw, 14px)/1 var(--font-code); padding: 4px 10px; }
.person.drag { cursor: grabbing; z-index: 50; filter: drop-shadow(0 12px 14px rgba(0,0,0,.3)); }
.person:focus-visible svg { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
.reset { font: 700 14px/1 var(--font-body); padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
details { max-width: 100%; }
details summary { cursor: pointer; }
details ol { margin: 8px 0 0; padding-left: 20px; max-width: 90ch; }
details li { margin: 3px 0; overflow-wrap: anywhere; }
details a { color: inherit; }
@media (max-width: 640px) {
  .stage { min-height: 700px; }
  .lane { top: 4%; height: 26%; }
}
@media (prefers-reduced-motion: reduce) { .m, .person { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>Warteschlange</h1>
  <span class="decl">Queue&lt;Person&gt; <b>warteschlange</b> = new Queue&lt;Person&gt;();</span>
</header>

<div class="methods" role="group" aria-label="Methoden der Klasse Queue">
  <button class="m" aria-pressed="false"><span class="obj">warteschlange</span>.isEmpty()</button>
  <button class="m" aria-pressed="false"><span class="obj">warteschlange</span>.enqueue(<span class="arg">pContent</span>)</button>
  <button class="m" aria-pressed="false"><span class="obj">warteschlange</span>.dequeue()</button>
  <button class="m" aria-pressed="false"><span class="obj">warteschlange</span>.front()</button>
</div>

<div class="stage" id="stage">
  <div class="counter">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="26" width="52" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M14 26V14h36v12" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="41" r="6" fill="currentColor"/></svg>
    <span class="sign">Schalter</span>
  </div>
  <div class="lane" id="lane"></div>
  <span class="area-label" id="labWait">Wartebereich</span>
</div>

<div class="bar">
  <button class="reset" id="reset">Alle zurück in den Wartebereich</button>
  <span>Personen mit dem Finger oder der Maus verschieben.</span>
</div>

<script>
(() => {
  function avatar(p) {
    const H = p.hair, S = p.skin;
    const hairBack = { long: `<path d="M30 62c0-30 14-44 30-44s30 14 30 44v52H30z" fill="${H}"/>`, afro: `<circle cx="60" cy="56" r="38" fill="${H}"/>`, bun: `<circle cx="60" cy="16" r="12" fill="${H}"/>` }[p.style] || '';
    const hairFront = {
      short: `<path d="M36 56c0-20 10-30 24-30s24 10 24 30c-6-10-14-14-24-14s-18 4-24 14z" fill="${H}"/>`,
      curly: `<g fill="${H}"><circle cx="42" cy="38" r="10"/><circle cx="54" cy="32" r="11"/><circle cx="67" cy="32" r="11"/><circle cx="78" cy="40" r="10"/><circle cx="37" cy="50" r="7"/><circle cx="83" cy="50" r="7"/></g>`,
      long: `<path d="M36 58c0-22 10-32 24-32s24 10 24 32c-8-12-18-16-30-14-8 2-14 6-18 14z" fill="${H}"/>`,
      bun: `<path d="M36 56c0-20 10-30 24-30s24 10 24 30c-6-9-14-13-24-13s-18 4-24 13z" fill="${H}"/>`,
      afro: '',
      beard: `<path d="M36 54c0-18 10-28 24-28s24 10 24 28c-6-8-14-11-24-11s-18 3-24 11z" fill="${H}"/>`,
      bob: `<path d="M34 76V56c0-20 11-30 26-30s26 10 26 30v20h-8V58c-6-8-12-12-18-12s-14 4-18 12v18z" fill="${H}"/>`,
      bald: `<path d="M36 60c0-4 1-7 2-9M84 60c0-4-1-7-2-9" stroke="${H}" stroke-width="6" stroke-linecap="round" fill="none"/>`
    }[p.style];
    const beard = p.style === 'beard' ? `<path d="M38 64c2 18 10 26 22 26s20-8 22-26c-4 8-10 10-22 10s-18-2-22-10z" fill="${H}"/>` : '';
    return `<svg viewBox="0 0 120 160" aria-hidden="true"><rect width="120" height="160" fill="${p.bg}"/>${hairBack}
      <path d="M14 160c0-30 20-48 46-48s46 18 46 48z" fill="${p.shirt}"/>
      <rect x="52" y="88" width="16" height="22" rx="6" fill="${S}"/>
      <ellipse cx="60" cy="62" rx="24" ry="28" fill="${S}"/>
      <circle cx="51" cy="62" r="3" fill="#1d1d1d"/><circle cx="69" cy="62" r="3" fill="#1d1d1d"/>
      <path d="M52 76q8 6 16 0" stroke="#1d1d1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      ${beard}${hairFront}</svg>`;
  }
  const PEOPLE = [
    { name: 'Ali',   skin: '#c68b5e', hair: '#1f1a17', style: 'short', shirt: '#2f7fc1', bg: '#cfe4f5' },
    { name: 'Ben',   skin: '#f1c9a5', hair: '#c9873d', style: 'curly', shirt: '#3c9a5f', bg: '#d6efdd' },
    { name: 'Clara', skin: '#f3cfb0', hair: '#6b3e1f', style: 'long',  shirt: '#c2456a', bg: '#f6d9e2' },
    { name: 'Deniz', skin: '#d9a47a', hair: '#2b211c', style: 'bun',   shirt: '#e0a21a', bg: '#f8ebc7' },
    { name: 'Emma',  skin: '#f6d6bd', hair: '#e2b155', style: 'long',  shirt: '#7a5cc4', bg: '#e4dcf6' },
    { name: 'Finn',  skin: '#efc2a0', hair: '#a23d21', style: 'short', shirt: '#d1603d', bg: '#f8dcd2' },
    { name: 'Greta', skin: '#8d5a3b', hair: '#140f0d', style: 'afro',  shirt: '#16938a', bg: '#cdeeea' },
    { name: 'Hamza', skin: '#b67a52', hair: '#1a1411', style: 'beard', shirt: '#44546a', bg: '#dbe1e9' },
    { name: 'Ida',   skin: '#f2c7ab', hair: '#3a2a20', style: 'bob',   shirt: '#e2703a', bg: '#fbe1d2' },
    { name: 'Jonas', skin: '#e8b892', hair: '#8a8a8a', style: 'bald',  shirt: '#1f6f50', bg: '#d4ebe0' }
  ];
  const stage = document.getElementById('stage');
  const lane = document.getElementById('lane');
  const lab = document.getElementById('labWait');
  const narrow = () => stage.clientWidth < 640;

  // method buttons: only highlight, one at a time
  const btns = [...document.querySelectorAll('.m')];
  btns.forEach(b => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    btns.forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', on);
  }));

  // start positions in % of stage: two rows in the waiting area below the lane
  function homes() {
    const n = PEOPLE.length;
    if (narrow()) {
      const cols = 3;
      return PEOPLE.map((_, i) => [34 + (i % cols) * 24 + (Math.floor(i / cols) % 2 ? 8 : 0), 45 + Math.floor(i / cols) * 14.5]);
    }
    const perRow = Math.ceil(n / 2);
    return PEOPLE.map((_, i) => {
      const r = Math.floor(i / perRow), c = i % perRow;
      return [21 + c * (64 / (perRow - 1 || 1)) + (r ? 8 : 0), 58 + r * 26];
    });
  }
  // shuffle order so the line-up is not chronological
  const order = PEOPLE.map((_, i) => i).sort(() => Math.random() - .5);
  const els = PEOPLE.map((p, i) => {
    const d = document.createElement('div');
    d.className = 'person'; d.tabIndex = 0; d.setAttribute('role', 'img');
    d.setAttribute('aria-label', p.name);
    d.innerHTML = avatar(p) + `<span class="tag">${p.name}</span>`;
    stage.appendChild(d); return d;
  });
  const pos = [];
  function place(i) { els[i].style.left = pos[i][0] + '%'; els[i].style.top = pos[i][1] + '%'; }
  function reset() {
    const h = homes();
    order.forEach((pi, slot) => { pos[pi] = h[slot].slice(); place(pi); });
    lab.style.left = '15%'; lab.style.top = narrow() ? '33%' : '42%';
  }
  reset();
  document.getElementById('reset').onclick = reset;

  let top = 10;
  els.forEach((el, i) => {
    let id = null, ox = 0, oy = 0;
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); id = e.pointerId; el.setPointerCapture(id);
      const r = stage.getBoundingClientRect();
      ox = e.clientX - (r.left + pos[i][0] / 100 * r.width);
      oy = e.clientY - (r.top + pos[i][1] / 100 * r.height);
      el.classList.add('drag'); el.style.zIndex = ++top;
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      const r = stage.getBoundingClientRect();
      pos[i] = [Math.min(97, Math.max(3, (e.clientX - ox - r.left) / r.width * 100)), Math.min(95, Math.max(5, (e.clientY - oy - r.top) / r.height * 100))];
      place(i);
    });
    const end = e => { if (e.pointerId !== id) return; id = null; el.classList.remove('drag'); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    // keyboard: arrows move the focused person
    el.addEventListener('keydown', e => {
      const k = { ArrowLeft: [-2, 0], ArrowRight: [2, 0], ArrowUp: [0, -2], ArrowDown: [0, 2] }[e.key];
      if (!k) return; e.preventDefault();
      pos[i] = [Math.min(97, Math.max(3, pos[i][0] + k[0])), Math.min(95, Math.max(5, pos[i][1] + k[1]))]; place(i);
    });
  });
})();
</script>

</body>
</html>
